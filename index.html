<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصور ټیلیکام</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f8f4;font-family:Arial,sans-serif;color:#183c2b}
header{background:#087b43;color:white;padding:25px 16px;text-align:center}
header h1{margin:0 0 8px}
main{padding:18px;max-width:650px;margin:auto}
.card{background:white;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 9px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.service{background:#e7f5ec;border:1px solid #c8e6d2;padding:22px 8px;border-radius:12px;text-align:center;font-weight:bold}
h2{color:#087b43;font-size:19px}
footer{text-align:center;padding:20px;color:#668}
</style>
</head>
<body><div style="padding:20px;text-align:center">
  <h3>د ډیټابېس ازموینه</h3>
  <button onclick="testSupabase()">Test Supabase Connection</button>
  <p id="result"></p>
</div>

<script>
async function testSupabase() {
  document.getElementById("result").innerText = "Testing...";
  const { data, error } = await supabase
    .from("currencies")
    .select("code,name")
    .limit(5);

  document.getElementById("result").innerText =
    error ? error.message : "Success! " + data.length + " currencies found.";
}
</script> 
<header>
<h1>منصور ټیلیکام</h1>
<p>ستاسو د ډیجیټل خدمتونو مرکز</p>
</header>
<main>
<div class="card">
<h2>ښه راغلاست!</h2>
<p>د منصور ټیلیکام آنلاین سیستم</p>
</div>
<div class="card">
<h2>خدمات</h2>
<div class="grid">
<div class="service">📱 موبایل چارج</div>
<div class="service">🌐 انټرنېټ بستې</div>
<div class="service">🎮 ګېم کریډیټ</div>
<div class="service">💱 د اسعارو نرخونه</div>
<div class="service">🏦 بانکونه</div>
<div class="service">📋 فرمایشونه</div>
</div>
</div>
<div class="card">
<h2>د مشتریانو برخه</h2>
<p>د حساب او بیلانس مدیریت</p>
</div>
</main>
<footer>© منصور ټیلیکام</footer>
</body>
</html>
